name: Alpine package

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: alpine-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and install APKs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ALPINE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            contracts/go.sum
            convo/go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Build Web UI, Core and CLI
        env:
          ASTRLINK_VERSION: ${{ inputs.release_tag || '' }}
          ASTRLINK_COMMIT: ${{ github.sha }}
        run: |
          make web-assets
          sh packaging/alpine/build.sh gateway
          . packaging/alpine/target.sh
          go version -m "$bins/astrlink-core" | grep -Fq -- "-tags=webui"
          grep -aFq "$ASTRLINK_COMMIT" "$bins/astrlink-core"

      # The worker uses the native musl compiler on each runner's architecture.
      # Each CI build signs with a disposable key and exports only its public key.
      - name: Build worker and sign APKs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          ASTRLINK_URL: https://github.com/${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/alpine-scan"
          docker run --rm -e ALPINE_ARCH -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT \
            -e RELEASE_TAG -e ASTRLINK_URL \
            -v "$PWD:/src" -v "$RUNNER_TEMP/alpine-scan:/scan" -w /src alpine:edge sh -ec '
              apk add --no-cache build-base cargo openssl
              sh packaging/alpine/build.sh worker
              mkdir -p dist/alpine
              openssl genrsa -out /tmp/astrlink-ci.rsa 3072
              openssl rsa -in /tmp/astrlink-ci.rsa -pubout -out dist/alpine/astrlink-ci.rsa.pub
              if [ -n "$RELEASE_TAG" ]; then
                apk_version=$(sh packaging/alpine/version.sh "$RELEASE_TAG")
              else
                apk_version="0_git${GITHUB_RUN_NUMBER}-r${GITHUB_RUN_ATTEMPT}"
              fi
              sh packaging/alpine/package.sh "$apk_version" /tmp/astrlink-ci.rsa dist/alpine
              (cd dist/alpine && sha256sum *.apk *.rsa.pub > SHA256SUMS)
              (cd /scan && apk extract --allow-untrusted /src/dist/alpine/*.apk)
            '

      - name: Check packages for production models
        run: bun scripts/check-no-production-models.mjs --packaged "$RUNNER_TEMP/alpine-scan"

      - name: Verify signatures and start the installed gateway
        run: |
          docker run --rm -v "$PWD/dist/alpine:/packages:ro" alpine:edge sh -ec '
            (cd /packages && sha256sum -c SHA256SUMS)
            cp /packages/astrlink-ci.rsa.pub /etc/apk/keys/
            apk verify /packages/*.apk
            apk add --no-cache /packages/*.apk
            ldd_out=$(ldd /usr/bin/astrlink-privacy-worker)
            ! printf "%s\n" "$ldd_out" | grep -Eqi "error loading|not found"
            test -e /usr/lib/libonnxruntime.so.1
            install -d -o astrlink -g astrlink /var/lib/astrlink
            export ASTRLINK_LISTEN=127.0.0.1:8317 ASTRLINK_DATA_DIR=/var/lib/astrlink
            export HOME="$ASTRLINK_DATA_DIR"
            su -p -s /bin/sh -c "exec astrlink-core serve" astrlink &
            for i in $(seq 1 30); do
              if astrlink-core healthcheck >/dev/null 2>&1; then break; fi
              sleep 1
            done
            astrlink-core healthcheck
            wget -qO /tmp/index.html http://127.0.0.1:8317/
            grep -q "static/js/" /tmp/index.html
            astrlink requests --limit 1 >/dev/null
          '
      - name: Upload verified packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astrlink-alpine-${{ matrix.arch }}
          path: dist/alpine/
          if-no-files-found: error
          retention-days: 14
